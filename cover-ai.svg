<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="معالج ذكاء اصطناعي متصل بدوائر رقمية مضيئة">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#43079C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#43079C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#0e0623"/>
  <g opacity=".5" fill="none" stroke="#7C3AED" stroke-opacity=".25" stroke-width="1">
    <path d="M0 40 H800 M0 120 H800 M0 250 H800 M0 380 H800 M0 460 H800"/>
    <path d="M80 0 V500 M200 0 V500 M340 0 V500 M470 0 V500 M610 0 V500 M740 0 V500"/>
  </g>
  <ellipse cx="400" cy="250" rx="320" ry="230" fill="url(#glow)"/>
  <!-- خطوط دائرية إلى الرقاقة -->
  <g fill="none" stroke="url(#beam)" stroke-width="3">
    <path d="M80 250 H210 Q230 250 230 230 V150 Q230 130 250 130 H330"/>
    <path d="M110 400 H240 Q260 400 260 380 V330 Q260 360 280 360 H330"/>
    <path d="M720 120 H600 Q580 120 580 140 V240 Q580 260 560 260 H510"/>
    <path d="M700 400 H560 Q540 400 540 380 V340"/>
    <path d="M400 40 V100"/>
    <path d="M400 460 V400"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="80" cy="250" r="7"/><circle cx="110" cy="400" r="7"/>
    <circle cx="720" cy="120" r="7"/><circle cx="700" cy="400" r="7"/>
    <circle cx="400" cy="40" r="7"/><circle cx="400" cy="460" r="7"/>
  </g>
  <g fill="#a78bfa" opacity=".8">
    <circle cx="330" cy="130" r="5"/><circle cx="280" cy="360" r="5"/>
    <circle cx="510" cy="260" r="5"/><circle cx="540" cy="340" r="5"/>
  </g>
  <!-- الرقاقة المركزية -->
  <rect x="290" y="160" width="220" height="180" rx="24" fill="url(#chip)"/>
  <rect x="290" y="160" width="220" height="180" rx="24" fill="none" stroke="#c4b5fd" stroke-opacity=".6" stroke-width="2"/>
  <g fill="none" stroke="#e9e2ff" stroke-opacity=".85" stroke-width="4" stroke-linecap="round">
    <path d="M370 205 q-14 22 10 30 q26 8 14 30"/>
    <path d="M400 195 v110"/><path d="M430 205 q14 22 -10 30 q-26 8 -14 30"/>
    <path d="M340 250 h36 M386 250 h28 M424 250 h36"/>
  </g>
  <g fill="#67e8f9" opacity=".9">
    <circle cx="340" cy="250" r="6"/><circle cx="474" cy="250" r="6"/>
  </g>
  <!-- أطراف الرقاقة -->
  <g stroke="#c4b5fd" stroke-opacity=".55" stroke-width="3" stroke-linecap="round">
    <path d="M320 160 V130 M370 160 V130 M430 160 V130 M480 160 V130"/>
    <path d="M320 340 V370 M370 340 V370 M430 340 V370 M480 340 V370"/>
  </g>
  <g fill="#d8b4fe" opacity=".9">
    <circle cx="600" cy="330" r="3"/><circle cx="620" cy="310" r="3"/><circle cx="640" cy="330" r="3"/>
    <circle cx="180" cy="180" r="3"/><circle cx="160" cy="200" r="3"/><circle cx="170" cy="230" r="3"/>
  </g>
</svg>
