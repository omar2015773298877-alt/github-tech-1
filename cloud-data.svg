<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="سحابة رقمية متصلة بالحاسوب والهاتف والخادم">
  <defs>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#43079C"/>
    </linearGradient>
    <radialGradient id="cglow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".45"/>
      <stop offset="1" stop-color="#43079C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241056"/>
      <stop offset="1" stop-color="#150838"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="#0c051f"/>
  <ellipse cx="450" cy="210" rx="330" ry="180" fill="url(#cglow)"/>
  <g opacity=".45" stroke="#7C3AED" stroke-opacity=".22" fill="none">
    <path d="M0 80 H900 M0 470 H900"/>
  </g>
  <!-- السحابة -->
  <path d="M300 262 a70 70 0 0 1 22 -136 a86 86 0 0 1 164 -18 a64 64 0 0 1 68 106 a58 58 0 0 1 -20 48 Z"
        fill="url(#cloud)" opacity=".92"/>
  <path d="M300 262 a70 70 0 0 1 22 -136 a86 86 0 0 1 164 -18 a64 64 0 0 1 68 106 a58 58 0 0 1 -20 48 Z"
        fill="none" stroke="#d8b4fe" stroke-opacity=".55" stroke-width="3"/>
  <g stroke="#e9e2ff" stroke-opacity=".9" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M446 122 v66"/><circle cx="446" cy="112" r="6" fill="#67e8f9" stroke="none"/>
    <circle cx="446" cy="145" r="9" stroke-width="3"/>
    <circle cx="446" cy="176" r="9" stroke-width="3" opacity=".65"/>
  </g>
  <!-- خطوط الاتصال -->
  <g fill="none" stroke="#67e8f9" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="7 9">
    <path d="M330 240 C300 320 250 350 190 388"/>
    <path d="M450 268 L450 388"/>
    <path d="M570 240 C600 320 640 350 700 388"/>
    <path d="M360 250 C320 300 190 330 110 352"/>
    <path d="M540 250 C590 300 740 330 800 352"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="190" cy="388" r="6"/><circle cx="450" cy="388" r="6"/><circle cx="700" cy="388" r="6"/>
    <circle cx="110" cy="352" r="5"/><circle cx="800" cy="352" r="5"/>
  </g>
  <!-- حاسوب محمول -->
  <g>
    <rect x="120" y="400" width="150" height="92" rx="10" fill="url(#dev)" stroke="#7C3AED" stroke-opacity=".6" stroke-width="2"/>
    <rect x="132" y="412" width="126" height="62" rx="5" fill="#0f2c46" stroke="#67e8f9" stroke-opacity=".4"/>
    <path d="M148 442 h60 M148 452 h84" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <path d="M95 500 h200 l14 16 a6 6 0 0 1 -6 8 H87 a6 6 0 0 1 -6 -8 Z" fill="#241056" stroke="#7C3AED" stroke-opacity=".6"/>
  </g>
  <!-- هاتف -->
  <g>
    <rect x="415" y="398" width="70" height="118" rx="14" fill="url(#dev)" stroke="#7C3AED" stroke-opacity=".6" stroke-width="2"/>
    <rect x="424" y="412" width="52" height="80" rx="6" fill="#0f2c46" stroke="#67e8f9" stroke-opacity=".4"/>
    <circle cx="450" cy="505" r="6" fill="#67e8f9" opacity=".85"/>
  </g>
  <!-- خادم -->
  <g>
    <rect x="640" y="392" width="120" height="128" rx="10" fill="url(#dev)" stroke="#7C3AED" stroke-opacity=".6" stroke-width="2"/>
    <g fill="#103a54" stroke="#67e8f9" stroke-opacity=".4">
      <rect x="654" y="408" width="92" height="26" rx="5"/>
      <rect x="654" y="444" width="92" height="26" rx="5"/>
      <rect x="654" y="480" width="92" height="26" rx="5"/>
    </g>
    <g fill="#67e8f9">
      <circle cx="668" cy="421" r="5"/><circle cx="668" cy="457" r="5"/><circle cx="668" cy="493" r="5"/>
    </g>
    <g stroke="#d8b4fe" stroke-width="3" stroke-linecap="round" opacity=".8">
      <path d="M700 420 h32 M700 456 h32 M700 492 h32"/>
    </g>
  </g>
</svg>
